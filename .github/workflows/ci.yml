name: "Say Hello"

on:
  push:
    branches:
      - main

jobs:
  hello_world:
    runs-on: ubuntu-24.04
    steps:
      - name: "Echo the message"
        run : |
          echo "Hola ronald"
      - name: "Fecha de hoy"
        run: date
      - name: "Listar archivos"
        run: ls -la
      - name: "Mostrar directorio actual"
        run : pwd
      - name: "Mostrar quien soy"
        run: whoami